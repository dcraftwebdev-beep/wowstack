
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/fav-icon.png" />
    <link rel="apple-touch-icon" href="/fav-icon.png" />

    <!-- Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Outfit:wght@300;400;500;600;700;800&display=swap"

    />

    <!-- Primary SEO -->
    <title>
      Wow Stack | Web Design & Website Development Company in India
    </title>

    <meta
      name="description"
      content="Wow Stack is a modern web design and website development company in India specializing in responsive websites, React JS development, UI/UX design, eCommerce solutions, WordPress websites, landing pages, and SEO-friendly digital experiences."

    <meta
      name="keywords"
      content="Wow Stack, web design company, website development company, React JS development, ecommerce website development, UI UX design, responsive web design, SEO friendly websites, WordPress development, India web agency"

    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Theme -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Wow Stack | Modern Web Design Company"
    />

    <meta
      property="og:description"
      content="We build high-performance websites using modern technologies like React JS, Next.js, Tailwind CSS, WordPress, and Shopify."
    />

    <!-- IMPORTANT -->
    <meta
      property="og:image"
      content="https://dcraftdev.netlify.app/dcraftmain.png"
    />

    <meta property="og:url" content="https://dcraftdev.netlify.app/" />

    <meta property="og:site_name" content="Wow Stack" />

    <meta
      name="twitter:title"
      content="Wow Stack | Web Design & Development"
    />

    <meta
      name="twitter:description"
      content="Modern web design, React JS development, eCommerce solutions, and SEO-friendly websites."
    />

    <!-- IMPORTANT -->
    <meta
      name="twitter:image"
      content="https://dcraftdev.netlify.app/dcraftmain.png"
    />

    <!-- Canonical (updated per-route by the app's <Seo> component) -->
    <link rel="canonical" href="https://dcraftdev.netlify.app/" />

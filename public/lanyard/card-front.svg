<svg xmlns="http://www.w3.org/2000/svg" width="512" height="773" viewBox="0 0 512 773">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141019"/>
      <stop offset="1" stop-color="#07060a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="773" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="737" rx="26" fill="none" stroke="#f59e0b" stroke-opacity="0.28" stroke-width="2"/>

  <!-- brand -->
  <g transform="translate(56,86)" font-family="Arial, Helvetica, sans-serif">
    <circle cx="10" cy="-6" r="9" fill="url(#amber)"/>
    <text x="30" y="0" fill="#f5f3ef" font-size="30" font-weight="700" letter-spacing="1">WOW STACK</text>
    <text x="30" y="30" fill="#f59e0b" font-size="15" font-weight="600" letter-spacing="4">DESIGN &amp; DEVELOPMENT</text>
  </g>

  <!-- headline -->
  <g transform="translate(56,300)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="0" fill="#efe9df" font-size="56" font-weight="800" letter-spacing="-1">Pricing</text>
    <text x="0" y="66" fill="#efe9df" font-size="56" font-weight="800" letter-spacing="-1">that pays</text>
    <text x="0" y="132" fill="url(#amber)" font-size="56" font-weight="800" letter-spacing="-1">for itself.</text>
  </g>

  <!-- price hint pill -->
  <g transform="translate(56,506)" font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="300" height="58" rx="14" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="22" y="38" fill="#fbbf24" font-size="24" font-weight="700">Plans from ₹14,999</text>
  </g>

  <!-- tagline -->
  <g transform="translate(56,690)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="0" fill="rgba(255,255,255,0.62)" font-size="20" font-weight="600" letter-spacing="2">DESIGN · BUILD · AUTOMATE</text>
    <text x="0" y="30" fill="rgba(255,255,255,0.42)" font-size="17">wowstack.vercel.app</text>
  </g>
</svg>
